<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Smooth dark background matching WEXLYE branding -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon / Favicon Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Bold Minimalist 'W' Mark -->
  <path d="M 108 148 L 164 364 L 224 198 L 256 198 L 288 198 L 348 364 L 404 148 L 444 148 L 372 404 L 328 404 L 256 244 L 184 404 L 140 404 L 68 148 Z" fill="#ffffff" />

  <!-- Signature Neon Green Brand Dot -->
  <circle cx="432" cy="380" r="26" fill="#39FF14" filter="url(#neonGlow)" />
</svg>